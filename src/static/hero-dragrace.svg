<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <linearGradient id="g_sky_dr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="g_neon_dr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g_sky_dr)"/>
  <!-- Sunset / City glow -->
  <circle cx="160" cy="110" r="70" fill="#EF4444" opacity="0.3"/>
  <rect y="110" width="320" height="50" fill="#090D16"/>
  <!-- Speed Lines -->
  <line x1="0" y1="125" x2="320" y2="125" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="140" x2="320" y2="140" stroke="#F59E0B" stroke-width="3" stroke-dasharray="15,10" opacity="0.6"/>

  <!-- Cars on Drag Strip -->
  <!-- Car 1 (Green Supercar) -->
  <g transform="translate(40, 95)">
    <path d="M0 22l14-14h38l18 14z" fill="#10B981"/>
    <rect x="18" y="10" width="22" height="7" rx="2" fill="#064E3B"/>
    <circle cx="12" cy="24" r="7" fill="#18181B" stroke="#6EE7B7" stroke-width="2"/>
    <circle cx="56" cy="24" r="7" fill="#18181B" stroke="#6EE7B7" stroke-width="2"/>
    <!-- Headlight beam -->
    <polygon points="68,16 140,8 140,30" fill="#6EE7B7" opacity="0.2"/>
  </g>

  <!-- Car 2 (Red Muscle Car) -->
  <g transform="translate(180, 85)">
    <path d="M0 26l18-16h46l20 16z" fill="#DC2626"/>
    <rect x="22" y="12" width="26" height="8" rx="2" fill="#450A0A"/>
    <circle cx="15" cy="28" r="8" fill="#18181B" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="68" cy="28" r="8" fill="#18181B" stroke="#FCA5A5" stroke-width="2"/>
    <!-- Exhaust flame -->
    <polygon points="-4,26 -24,24 -12,28" fill="#F59E0B"/>
  </g>

  <!-- Typography "DRAG RACING" -->
  <text x="160" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DRAG RACING</text>
  <rect x="90" y="60" width="140" height="3" fill="url(#g_neon_dr)"/>
</svg>
