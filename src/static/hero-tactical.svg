<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380">
  <defs>
    <linearGradient id="g_tactical_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g_amber_glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g_cyan_laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="860" height="380" fill="url(#g_tactical_bg)"/>

  <!-- Tactical Grid and Target Rings -->
  <g opacity="0.15">
    <circle cx="650" cy="190" r="140" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="650" cy="190" r="90" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="650" cy="190" r="40" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <line x1="480" y1="190" x2="820" y2="190" stroke="#38BDF8" stroke-width="2"/>
    <line x1="650" y1="20" x2="650" y2="360" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- Hexagonal Tech Matrix Elements -->
  <g opacity="0.12" fill="none" stroke="#38BDF8" stroke-width="1.5">
    <polygon points="120,40 150,22 180,40 180,75 150,92 120,75"/>
    <polygon points="180,40 210,22 240,40 240,75 210,92 180,75"/>
    <polygon points="240,40 270,22 300,40 300,75 270,92 240,75"/>
  </g>

  <!-- Large Stylized Title: RAINBOW SIX MOBILE -->
  <g transform="translate(60, 60)">
    <text x="0" y="85" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="2">RAINBOW</text>
    <text x="350" y="85" font-family="'Impact', 'Arial Black', sans-serif" font-size="96" font-weight="900" fill="url(#g_amber_glow)">6</text>
    <text x="0" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="800" fill="#38BDF8" letter-spacing="6">TACTICAL MOBILE FPS</text>
    <rect x="0" y="170" width="420" height="4" fill="url(#g_cyan_laser)"/>
  </g>

  <!-- Tactical Operator Shield Insignia -->
  <g transform="translate(650, 190)">
    <path d="M-60,-80 L60,-80 L75,-20 L0,90 L-75,-20 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="6"/>
    <path d="M-45,-65 L45,-65 L55,-15 L0,70 L-55,-15 Z" fill="#0F172A"/>
    <text x="0" y="25" font-family="'Impact', sans-serif" font-size="78" font-weight="900" fill="#F59E0B" text-anchor="middle">6</text>
  </g>
</svg>
